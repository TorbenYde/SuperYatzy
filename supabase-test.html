<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperYatzy – Supabase test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#202830}header{background:#18202a;color:white;padding:12px}h1{margin:0;font-size:20px}
.panel{background:white;margin:12px;padding:14px;border-radius:9px;box-shadow:0 1px 4px #0001}.row{display:flex;gap:7px;flex-wrap:wrap}
input,button{font:inherit;padding:9px;border-radius:7px}input{border:1px solid #cbd2da}button{border:0;background:#e4e8ed;cursor:pointer}button.primary{background:#2368d1;color:white}
.code{font-size:25px;font-weight:800;letter-spacing:4px}.status{padding:10px;border-radius:7px;background:#eef1f4}.ok{background:#e5f5e9;color:#176b35}.err{background:#fde7e7;color:#a21d1d}
.player{display:inline-block;padding:8px 11px;background:#eef5ff;border-radius:7px;font-weight:bold;margin:3px}
.log{font-family:monospace;font-size:12px;background:#18202a;color:#dce5ed;padding:10px;border-radius:7px;min-height:50px}
.small{font-size:12px;color:#68727c}
</style></head><body>
<header><h1>SuperYatzy – Supabase forbindelsestest</h1><div>Tester kun online-forbindelsen – Yatzy v7 ændres ikke.</div></header>
<div class="panel"><h2>Opret eller deltag</h2><div class="row">
<input id="name" placeholder="Dit navn"><input id="room" placeholder="Spilkode">
<button class="primary" onclick="createRoom()">Opret spil</button><button onclick="joinRoom()">Deltag</button></div>
<p class="small">Efter oprettelse kan du dele linket med deltageren.</p></div>
<div class="panel" id="game" style="display:none"><h2>Spil</h2>
<p>Spilkode: <span class="code" id="code"></span></p>
<div class="row"><button class="primary" onclick="shareGame()">Del spil</button><button onclick="copyLink()">Kopiér link</button><button id="test" onclick="sendTest()" disabled>Send testbesked</button></div>
<p id="status" class="status">Forbinder…</p></div>
<div class="panel" id="people" style="display:none"><h2>Online deltagere</h2><div id="list"></div></div>
<div class="panel" id="messages" style="display:none"><h2>Modtagne beskeder</h2><div id="log" class="log">Ingen endnu.</div></div>
<script>
const URL="https://ybprfzbyqkqsujnnabzp.supabase.co";
const KEY="sb_publishable_Rs2pjqj_g9Xu4T7ZZAG0aQ_d1IqIyjw";
const sb=supabase.createClient(URL,KEY);
let ch=null,room="",name="",id=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function makeCode(){return Math.random().toString(36).slice(2,7).toUpperCase()}
function setStatus(t,c){let e=document.getElementById("status");e.textContent=t;e.className="status "+(c||"")}
function createRoom(){name=document.getElementById("name").value.trim()||"Spiller 1";room=makeCode();location.hash="room="+room;connect()}
function joinRoom(){name=document.getElementById("name").value.trim()||"Spiller";room=document.getElementById("room").value.trim().toUpperCase();if(!room){alert("Indtast en spilkode.");return}location.hash="room="+room;connect()}
async function connect(){
 if(ch)await sb.removeChannel(ch);
 document.getElementById("game").style.display="block";document.getElementById("people").style.display="block";document.getElementById("messages").style.display="block";
 document.getElementById("code").textContent=room;setStatus("Forbinder til Supabase…");
 ch=sb.channel("yatzy12-test:"+room,{config:{presence:{key:id},broadcast:{ack:true}}});
 ch.on("presence",{event:"sync"},showPeople)
   .on("broadcast",{event:"test-message"},p=>log((p.payload?.name||"En spiller")+" sendte: "+(p.payload?.text||"Hej!")));
 ch.subscribe(async s=>{
   if(s==="SUBSCRIBED"){setStatus("Forbundet til Supabase – online","ok");document.getElementById("test").disabled=false;await ch.track({name,joined_at:new Date().toISOString()});showPeople();log("Forbindelsen er oprettet.")}
   else if(s==="CHANNEL_ERROR"){setStatus("Fejl: Realtime-forbindelsen kunne ikke oprettes","err")}
   else if(s==="TIMED_OUT"){setStatus("Timeout ved forbindelse til Supabase","err")}
 });
}
function showPeople(){if(!ch)return;let a=[];Object.values(ch.presenceState()).forEach(x=>(x||[]).forEach(p=>a.push(p.name||"Spiller")));a.sort();document.getElementById("list").innerHTML=a.map(n=>'<span class="player">'+esc(n)+'</span>').join("")||"Ingen"}
async function sendTest(){if(!ch)return;await ch.send({type:"broadcast",event:"test-message",payload:{name,text:"Hej fra "+name+" kl. "+new Date().toLocaleTimeString("da-DK")}})}
function log(t){let e=document.getElementById("log");let d=document.createElement("div");d.textContent=new Date().toLocaleTimeString("da-DK")+" – "+t;e.appendChild(d)}
function link(){return location.href.split("#")[0]+"#room="+encodeURIComponent(room)}
async function copyLink(){await navigator.clipboard.writeText(link());alert("Link kopieret.")}
async function shareGame(){let u=link(),t="Deltag i mit SuperYatzy-spil. Spilkode: "+room;if(navigator.share){try{await navigator.share({title:"SuperYatzy",text:t,url:u})}catch(e){}}else{await navigator.clipboard.writeText(t+"\n"+u);alert("Spiloplysninger kopieret.")}}
let m=location.hash.match(/room=([^&]+)/);if(m)document.getElementById("room").value=decodeURIComponent(m[1]);
</script></body></html>
